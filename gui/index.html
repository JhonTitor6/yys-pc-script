<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阴阳师脚本工作台</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail">
      <div class="brand-mark">阴</div>
      <button class="rail-button active" data-view="execute" title="执行">▶</button>
      <button class="rail-button" data-view="workflows" title="编排">⏱</button>
      <button class="rail-button" data-view="progress" title="进度暂未开放" aria-disabled="true" disabled>▦</button>
      <button class="rail-button" data-view="logs" title="日志暂未开放" aria-disabled="true" disabled>≡</button>
      <button class="rail-button" data-view="settings" title="设置暂未开放" aria-disabled="true" disabled>⚙</button>
    </aside>
    <aside class="script-panel">
      <div class="panel-title">
        <p>脚本列表</p>
        <h1>执行工作台</h1>
      </div>
      <div id="scriptList" class="script-list"></div>
    </aside>
    <main class="main-panel">
      <section id="executeView" class="view active">
        <header class="run-header">
          <div>
            <p class="eyebrow">当前运行</p>
            <h2 id="currentRunTitle">暂无运行脚本</h2>
          </div>
          <div class="run-actions">
            <span id="runStatus" class="status-pill idle">空闲</span>
            <button id="pauseButton" class="ghost-button" disabled>暂停</button>
            <button id="resumeButton" class="ghost-button" disabled>恢复</button>
            <button id="stopButton" class="danger-button" disabled>停止</button>
          </div>
        </header>
        <section class="run-summary">
          <div>
            <p class="eyebrow">参数</p>
            <p id="runConfigText" class="summary-value">未启动</p>
            <div class="progress-bar"><span id="progressBar"></span></div>
          </div>
          <div class="metric-grid">
            <div class="metric"><p>已战斗</p><strong id="battleCount">0 / 0</strong></div>
            <div class="metric"><p>胜利</p><strong id="victoryCount">0</strong></div>
            <div class="metric"><p>运行来源</p><strong id="runSource">-</strong></div>
          </div>
        </section>
        <section class="log-panel">
          <div class="log-header">
            <span>实时日志</span>
            <div class="log-actions">
              <select id="logLevelFilter">
                <option value="DEBUG">DEBUG+</option>
                <option value="INFO" selected>INFO+</option>
                <option value="WARNING">WARN+</option>
                <option value="ERROR">ERROR</option>
              </select>
              <button id="clearLogButton">清空</button>
            </div>
          </div>
          <div id="logBody" class="log-body"></div>
        </section>
      </section>
      <section id="workflowsView" class="view">
        <header class="workflows-view-header">
          <h2>编排任务</h2>
          <button id="newWorkflowButton" type="button" class="primary-button">+ 新建编排</button>
        </header>
        <div id="workflowList" class="workflow-list"></div>
      </section>
    </main>
    <aside class="side-panel">
      <section class="side-card"><p class="eyebrow">调度预告</p><div id="schedulePreview">暂无启用任务</div></section>
      <section class="side-card"><p class="eyebrow">断点快照</p><div id="snapshotPreview">暂无快照</div></section>
      <section class="side-card"><p class="eyebrow">关键日志</p><div id="keyLogPreview">暂无警告或错误</div></section>
    </aside>
  </div>
  <div id="workflowModal" class="modal-overlay" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="workflowModalTitle">
      <div class="modal-header">
        <h3 id="workflowModalTitle">新建编排</h3>
        <button id="closeWorkflowModalButton" type="button" class="modal-close" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body">
        <form id="workflowModalForm" class="workflow-editor">
          <input type="hidden" name="workflow_id" value="">
          <label><span>名称</span><input name="name" required></label>
          <label><span>分组</span><input name="group_name"></label>
          <label><span>失败策略</span>
            <select name="failure_policy">
              <option value="stop_workflow">失败后停止</option>
              <option value="continue_next">失败后继续</option>
              <option value="retry_then_stop">重试后停止</option>
            </select>
          </label>
          <div id="workflowModalSteps" class="step-accordion-list"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button id="addModalStep" type="button" class="ghost-button">+ 添加步骤</button>
        <span class="spacer"></span>
        <button id="cancelWorkflowModalButton" type="button" class="ghost-button">取消</button>
        <button id="saveWorkflowModalButton" type="submit" class="primary-button" form="workflowModalForm">保存</button>
      </div>
    </div>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
