[package]
name = "yys-desktop"
version = "1.0.0"
edition = "2021"
rust-version = "1.99.1"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1.0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
smoke-test = []

[profile.dev]
debug = 0
incremental = false
